# The shared `flightrec` package (importable by tools and experiments) plus tool config.
# Install everything with: python -m pip install -r experiments/requirements.txt

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrec"
description = "Shared modules for the Flight Record experiments and tools"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["sounddevice>=0.5", "numpy>=2.1", "scipy>=1.14"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["flightrec*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["unity"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments", "tools"]
addopts = "-ra"
